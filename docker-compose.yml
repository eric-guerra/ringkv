x-node: &node
  build: .
  environment: &env
    RINGKV_PEERS: n1@node1:7000,n2@node2:7000,n3@node3:7000,n4@node4:7000
    RINGKV_N: "3"
    RINGKV_W: "2"
    RINGKV_R: "2"

services:
  node1:
    <<: *node
    environment: { <<: *env, RINGKV_SELF: n1@node1:7000 }
    ports: ["7001:7000"]
  node2:
    <<: *node
    environment: { <<: *env, RINGKV_SELF: n2@node2:7000 }
    ports: ["7002:7000"]
  node3:
    <<: *node
    environment: { <<: *env, RINGKV_SELF: n3@node3:7000 }
    ports: ["7003:7000"]
  node4:
    <<: *node
    environment: { <<: *env, RINGKV_SELF: n4@node4:7000 }
    ports: ["7004:7000"]
